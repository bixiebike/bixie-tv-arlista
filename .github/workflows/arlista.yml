name: TV árlista frissítés

on:
  schedule:
    - cron: "*/15 4-19 * * *"   # UTC, kb. 5/6-21 óra magyar idő szerint, negyedóránként
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "generator/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Képgyorsítótár
        uses: actions/cache@v4
        with:
          path: public/img
          key: img-${{ github.run_id }}
          restore-keys: img-
      - name: Árak lekérése a Shoprenterből
        env:
          SHOPRENTER_USER: ${{ secrets.SHOPRENTER_USER }}
          SHOPRENTER_PASS: ${{ secrets.SHOPRENTER_PASS }}
        run: python generator/general.py public
      - run: cp -r site/. public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
